{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="text-center">Send Money</h3>
            <form method="POST">
                <div class="mb-3">
                    <label>Receiver Account Number</label>
                    <input type="number" name="receiver_account" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Amount (PKR)</label>
                    <input type="number" step="0.01" name="amount" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Send</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary w-100 mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
