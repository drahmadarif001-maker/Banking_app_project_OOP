{% extends "base.html" %}
{% block content %}
<div class="balance-card mb-4">
    <h5>Current Balance</h5>
    <h2 class="display-5 fw-bold">PKR {{ "%.2f"|format(user.balance) }}</h2>
    <small>{{ user.name }} | {{ user.account_type }} Account</small>
</div>

<div class="row g-3 mb-4">
    <div class="col-md-6">
        <div class="card p-3">
            <form method="POST" action="{{ url_for('deposit') }}">
                <div class="input-group">
                    <span class="input-group-text">PKR</span>
                    <input type="number" step="0.01" name="amount" class="form-control" placeholder="Deposit amount" required>
                    <button class="btn btn-success" type="submit">Deposit</button>
                </div>
            </form>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-3">
            <form method="POST" action="{{ url_for('withdraw') }}">
                <div class="input-group">
                    <span class="input-group-text">PKR</span>
                    <input type="number" step="0.01" name="amount" class="form-control" placeholder="Withdraw amount" required>
                    <button class="btn btn-danger" type="submit">Withdraw</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="row g-3">
    <div class="col-md-3">
        <a href="{{ url_for('send_money') }}" class="btn btn-outline-primary action-btn w-100">📤 Send Money</a>
    </div>
    <div class="col-md-3">
        <a href="{{ url_for('history') }}" class="btn btn-outline-secondary action-btn w-100">📜 History</a>
    </div>
    <div class="col-md-3">
        <a href="{{ url_for('account_info') }}" class="btn btn-outline-info action-btn w-100">ℹ️ Account Info</a>
    </div>
    <div class="col-md-3">
        <a href="{{ url_for('logout') }}" class="btn btn-outline-dark action-btn w-100">🚪 Logout</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Add custom number formatting filter for Jinja
</script>
{% endblock %}
