{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <div class="text-center mb-4">
                <span style="font-size: 4rem;">🏦</span>
                <h2 class="mt-2">Login to Your Account</h2>
                <p class="text-muted">Secure access to your digital bank</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Account Number</label>
                    <input type="number" name="account_number" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('signup') }}">Don't have an account? Create one</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
