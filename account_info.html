{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h3 class="text-center mb-4">Account Information</h3>
            <table class="table table-borderless">
                <tr><th>Account Number</th><td>{{ user.account_number }}</td></tr>
                <tr><th>Full Name</th><td>{{ user.name }}</td></tr>
                <tr><th>Age</th><td>{{ user.age }}</td></tr>
                <tr><th>Account Type</th><td>{{ user.account_type }}</td></tr>
                <tr><th>Current Balance</th><td>PKR {{ user.balance|round(2) }}</td></tr>
            </table>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
